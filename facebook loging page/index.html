<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Login UI — Demo</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    body{background:#f0f2f5;display:flex;justify-content:center;min-height:100vh}
    .mobile-container{width:100%;max-width:430px;background:#fff;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 0 15px rgba(0,0,0,.05)}
    .demo-note{background:#fff4d6;color:#694d00;text-align:center;padding:9px 12px;font-size:12px;font-weight:600}
    .top-banner{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid #e4e6eb;color:#1877f2;font-size:14px;font-weight:500;gap:10px}
    .top-banner svg{width:20px;height:20px;flex-shrink:0}
    .language-selector{text-align:center;padding:16px 0;font-size:13px;color:#65676b;cursor:pointer}
    .logo-section{display:flex;justify-content:center;align-items:center;margin:32px 0 44px}
    .brand-logo{width:60px;height:60px;border-radius:50%;display:flex;justify-content:center;align-items:center;background:#0866ff;color:white;font-size:42px;font-weight:700}
    .form-section{padding:0 16px;display:flex;flex-direction:column;gap:12px}
    .input-field{width:100%;height:54px;padding:0 16px;border:1px solid #ccd0d5;border-radius:12px;font-size:16px;color:#1c1e21;background:#fff;outline:none}
    .input-field:focus{border-color:#1c1e21}
    .login-btn{width:100%;height:44px;background:#0064e0;color:#fff;border:0;border-radius:22px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}
    .forgot-link{text-align:center;margin-top:8px;font-size:15px;font-weight:500;color:#1c1e21;text-decoration:none}
    .bottom-section{padding:24px 16px 28px;display:flex;flex-direction:column;align-items:center;gap:20px;margin-top:auto}
    .create-account-btn{width:100%;height:44px;background:transparent;color:#0064e0;border:1px solid #0064e0;border-radius:22px;font-size:15px;font-weight:600;cursor:pointer}
    .meta-footer{display:flex;align-items:center;gap:5px;color:#465a69;font-size:15px;font-weight:600}
    .meta-footer strong{color:#0064e0;font-size:19px}
    .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(28,30,33,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s;z-index:100;white-space:nowrap}
    .toast.show{opacity:1}
  </style>
</head>
<body>
  <main class="mobile-container">
    <div>
      <div class="demo-note">DEMO UI ONLY — Do not enter real account details</div>
      <div class="top-banner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span>Mobile login interface preview</span>
      </div>
      <div class="language-selector" id="language" onclick="toggleLanguage()">English (UK)</div>
      <div class="logo-section"><div class="brand-logo" aria-label="Demo logo">D</div></div>
      <form class="form-section" onsubmit="demoSubmit(event)">
        <input class="input-field" type="text" placeholder="Demo username (optional)" autocomplete="off">
        <input class="input-field" type="password" placeholder="Password field preview" disabled aria-label="Disabled password field preview">
        <button class="login-btn" type="submit">Preview button</button>
        <a class="forgot-link" href="#" onclick="showToast('Demo link only');return false;">Forgot password?</a>
      </form>
    </div>
    <div class="bottom-section">
      <button class="create-account-btn" type="button" onclick="showToast('Demo button only')">Create account</button>
      <div class="meta-footer"><strong>●</strong><span>DEMO</span></div>
    </div>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script>
    const languages=['English (UK)','বাংলা','English (US)','हिन्दी','Español'];let langIndex=0;
    function toggleLanguage(){langIndex=(langIndex+1)%languages.length;document.getElementById('language').textContent=languages[langIndex];showToast('Language: '+languages[langIndex]);}
    function demoSubmit(e){e.preventDefault();showToast('This is a visual demo. No login or data submission occurs.');}
    function showToast(message){const toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),2200);}
  </script>
</body>
</html>
